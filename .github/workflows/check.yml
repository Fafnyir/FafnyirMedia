name: Validate addon
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tools/check.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FafnyirMedia-validated-build
          path: dist/*
